name: Build Executables

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact: mind-mirror-linux-x86_64
            exe: dist/mind-mirror
          - os: windows-latest
            artifact: mind-mirror-windows-x86_64
            exe: dist/mind-mirror.exe
          - os: macos-latest
            artifact: mind-mirror-macos
            exe: dist/mind-mirror
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: 安装依赖与 PyInstaller
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller

      - name: 构建可执行文件（Linux / macOS）
        if: runner.os != 'Windows'
        run: bash packaging/build.sh

      - name: 构建可执行文件（Windows）
        if: runner.os == 'Windows'
        run: packaging\build.bat

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.exe }}

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
